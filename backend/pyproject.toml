[project]
name = "project-manager-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.1",
    "pytz>=2026.5",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

# --- ruff ---------------------------------------------------------------------

[tool.ruff]
line-length = 100
# target-version is inferred from project.requires-python

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RET",   # flake8-return
    "PTH",   # flake8-use-pathlib
    "DTZ",   # flake8-datetimez
    "T20",   # flake8-print
    "S",     # flake8-bandit (incl. S608 string-built SQL)
    "ASYNC", # flake8-async
    "PT",    # flake8-pytest-style
    "FAST",  # FastAPI
    "RUF",   # ruff-specific
]
ignore = [
    "E501", # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", # assert
    "S105", # hardcoded password string
    "S106", # hardcoded password argument
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
]

[tool.ruff.format]
docstring-code-format = true

# --- pyright ------------------------------------------------------------------

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

# --- pytest -------------------------------------------------------------------

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra"]
strict = true

[dependency-groups]
dev = ["pyright>=1.1.414", "pytest>=9.1.1", "ruff>=0.17.2"]

[project.scripts]
server-dev = "src.main:server_dev"
server-prod = "src.main:server_prod"
